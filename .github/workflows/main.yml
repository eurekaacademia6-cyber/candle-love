name: Build Quotex Next Candle AI

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ==================================================
      # CHECKOUT
      # ==================================================
      - name: Checkout repository
        uses: actions/checkout@v6


      # ==================================================
      # JAVA
      # ==================================================
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ==================================================
      # ANDROID SDK
      # ==================================================
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"


      # ==================================================
      # GRADLE
      # ==================================================
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"


      # ==================================================
      # ENVIRONMENT
      # ==================================================
      - name: Show environment
        run: |
          echo "===================================="
          echo "JAVA"
          echo "===================================="
          java -version

          echo ""
          echo "===================================="
          echo "GRADLE"
          echo "===================================="
          gradle --version

          echo ""
          echo "===================================="
          echo "ROOT DIRECTORY"
          echo "===================================="
          pwd
          ls -la


      # ==================================================
      # SHOW COMPLETE PROJECT STRUCTURE
      # ==================================================
      - name: Inspect complete project
        run: |
          echo ""
          echo "===================================="
          echo "ALL PROJECT FILES"
          echo "===================================="

          find . \
            -type f \
            -not -path "./.git/*" \
            | sort

          echo ""
          echo "===================================="
          echo "JAVA FILES"
          echo "===================================="

          find app/src/main/java \
            -type f \
            -name "*.java" \
            -print \
            | sort

          echo ""
          echo "===================================="
          echo "RESOURCE FILES"
          echo "===================================="

          find app/src/main/res \
            -type f \
            -print \
            | sort


      # ==================================================
      # SHOW IMPORTANT GRADLE FILES
      # ==================================================
      - name: Show Gradle configuration
        run: |
          echo ""
          echo "===================================="
          echo "settings.gradle"
          echo "===================================="

          cat settings.gradle

          echo ""
          echo "===================================="
          echo "root build.gradle"
          echo "===================================="

          cat build.gradle

          echo ""
          echo "===================================="
          echo "app build.gradle"
          echo "===================================="

          cat app/build.gradle


      # ==================================================
      # CHECK OLD RESOURCE PROBLEM
      # ==================================================
      - name: Check themes
        run: |
          echo ""
          echo "===================================="
          echo "THEME FILES"
          echo "===================================="

          find app/src/main/res/values \
            -maxdepth 1 \
            -type f \
            -print \
            | sort

          echo ""

          if [ -f app/src/main/res/values/styles.xml ]; then
            echo "WARNING: styles.xml exists."
            echo "This may cause duplicate theme resources."
          else
            echo "No styles.xml found."
          fi


      # ==================================================
      # CLEAN
      # ==================================================
      - name: Remove old build output
        run: |
          rm -rf .gradle
          rm -rf build
          rm -rf app/build


      # ==================================================
      # GRADLE CLEAN
      # ==================================================
      - name: Gradle clean
        run: |
          gradle clean --stacktrace


      # ==================================================
      # REAL ANDROID BUILD
      # ==================================================
      - name: Build debug APK
        run: |
          gradle assembleDebug \
            --stacktrace \
            --info


      # ==================================================
      # FIND APK
      # ==================================================
      - name: Find generated APK
        run: |
          echo ""
          echo "===================================="
          echo "GENERATED APK"
          echo "===================================="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print


      # ==================================================
      # VERIFY APK
      # ==================================================
      - name: Verify APK
        run: |
          COUNT=$(
            find app/build/outputs/apk/debug \
              -type f \
              -name "*.apk" \
              | wc -l
          )

          echo "APK COUNT: $COUNT"

          if [ "$COUNT" -eq 0 ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi


      # ==================================================
      # UPLOAD
      # ==================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuotexNextCandleAI-RealVision-2.1
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
